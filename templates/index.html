<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZolikStore Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            text-align: center;
            padding-top: 50px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h1>Привет, <span id="user-name">Пользователь</span>!</h1>
    
    <button id="simple-send">Отправить данные в чат</button>
    <button id="worker-send">Запрос через Cloudflare</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); 
        tg.expand();

        // Отображаем имя пользователя, если Telegram его передал
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
        }

        const WORKER_URL = 'https://zolikvkedax.plechik52.workers.dev/'; 

        // Функция для отправки данных на Cloudflare
        async function sendDataToWorker(textToSend) {
            let userId = 0;
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                userId = tg.initDataUnsafe.user.id;
            }

            if (userId === 0) return; // Если ID нет, ничего не делаем

            try {
                await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        user_id: userId, 
                        text: textToSend 
                    })
                });
                tg.close(); // Закрываем Mini App после успешной отправки
            } catch (error) {
                console.error("Ошибка отправки:", error);
            }
        }

        // Кнопка 1: Отправляет первый вариант текста через Cloudflare
        document.getElementById('simple-send').addEventListener('click', () => {
            sendDataToWorker('Кнопка 1: Данные из чата {"source":"GitHub Pages","status":"ok"}');
        });

        // Кнопка 2: Отправляет второй вариант текста через Cloudflare
        document.getElementById('worker-send').addEventListener('click', () => {
            sendDataToWorker('Кнопка 2: Сигнал из мини-приложения прилетел в Cloudflare!');
        });
    </script>
</body>
</html>
